name: CalcWorld SEO Robot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calcworld-seo-robot
  cancel-in-progress: false

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate robot syntax
        run: node --check scripts/seo-robot.js
      - name: Run SEO robot once
        run: node scripts/seo-robot.js
      - name: Commit keyword catalog and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo-data/ sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No SEO data or sitemap changes."
          else
            git commit -m "chore(seo): update CalcWorld keyword catalog and sitemap"
            git push origin HEAD:main
          fi
