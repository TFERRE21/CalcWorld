name: Deploy CalcWorld to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check official legislation sources
        run: node scripts/update-legal-rules.cjs
      - name: Commit legal data if changed
        run: |
          if git diff --quiet; then
            echo "No legal-data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add legal-rules.json
            git commit -m "chore: update official legal data"
            git push
          fi
      - name: Validate calculator catalog
        run: node scripts/validate-site.cjs
      - name: Generate multilingual calculator pages
        run: node scripts/generate-site.cjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
