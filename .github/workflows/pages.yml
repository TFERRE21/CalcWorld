name: Build and Sync CalcWorld

on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check official legislation sources
        run: node scripts/update-legal-rules.cjs
      - name: Commit legal data if changed
        run: |
          if git diff --quiet; then
            echo "No legal-data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add legal-rules.json
            git commit -m "chore: update official legal data"
            git push
          fi
      - name: Validate server and market JavaScript
        run: |
          node --check server.js
          node --check market.js
      - name: Validate calculator catalog
        run: node scripts/validate-site.cjs
      - name: Remove deprecated Spanish generated pages
        run: rm -rf es
      - name: Generate PT and English calculator pages
        run: node scripts/generate-site.cjs
      - name: Commit generated pages for external hosting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Generated pages already up to date."
          else
            git commit -m "chore: sync generated calculator pages [skip ci]"
            git push
          fi
