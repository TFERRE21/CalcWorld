name: Validate CalcWorld content generation

on:
  push:
    branches:
      - main
      - fix/adsense-content-quality
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check generator syntax
        run: node --check scripts/generate-site.cjs
      - name: Generate calculator pages
        run: node scripts/generate-site.cjs
      - name: Validate calculator catalog
        run: node scripts/validate-site.cjs
